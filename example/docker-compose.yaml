---
# Try-out stack for sqlastack-formstore: PostgreSQL + Plone backend.
# The packages are installed from Test PyPI (current dev releases) at
# container start — no local build needed. Frontend: see frontend/README.
#
#   docker compose up -d
#   -> backend on http://localhost:8080 (site "Plone", admin/admin)

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: formstore
      POSTGRES_PASSWORD: formstore
      POSTGRES_DB: formstore
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "formstore"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: plone/plone-backend:6.2.2
    environment:
      ADDONS: "sqlastack-formstore psycopg[binary]"
      PIP_PARAMS: "--extra-index-url https://test.pypi.org/simple/"
      SQLASTACK_FORMS_URL: "postgresql+psycopg://formstore:formstore@db:5432/formstore"
    command: /app/bin/sqlastack-formstore-migrate
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: plone/plone-backend:6.2.2
    environment:
      SITE: Plone
      TYPE: volto
      # ohne mindestens eine CORS_-Variable generiert das Image KEINE CORS-Policy
      CORS_ALLOW_ORIGIN: "http://localhost:3000,http://127.0.0.1:3000"
      # unsichtbares Honeypot-Feld als Captcha-Provider (volto-form-block verlangt einen)
      HONEYPOT_FIELD: "protected_1"
      ADDONS: "collective.volto.formsupport[honeypot]==3.3.2 sqlastack-formstore psycopg[binary]"
      PROFILES: "collective.volto.formsupport:default,sqlastack.formstore:default"
      PIP_PARAMS: "--extra-index-url https://test.pypi.org/simple/"
      SQLASTACK_FORMS_URL: "postgresql+psycopg://formstore:formstore@db:5432/formstore"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
