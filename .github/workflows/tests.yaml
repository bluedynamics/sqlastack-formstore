---
name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sqlastack-formstore
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sqlastack
          POSTGRES_PASSWORD: sqlastack
          POSTGRES_DB: sqlastack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sqlastack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      SQLASTACK_TEST_PG_URL: "postgresql+psycopg://sqlastack:sqlastack@localhost:5432/sqlastack_test"

    steps:
      - uses: actions/checkout@v6
        with:
          path: sqlastack-formstore
          fetch-depth: 0

      - uses: actions/checkout@v6
        with:
          repository: bluedynamics/sqlastack-core
          path: sqlastack-core
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "sqlastack-formstore/pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=

      - name: Rename coverage data
        run: mv .coverage .coverage.${{ matrix.python-version }}

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.python-version }}
          path: sqlastack-formstore/.coverage.${{ matrix.python-version }}
          include-hidden-files: true
          if-no-files-found: ignore

  test-plone:
    name: Plone integration (3.13)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sqlastack-formstore

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sqlastack
          POSTGRES_PASSWORD: sqlastack
          POSTGRES_DB: sqlastack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sqlastack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      SQLASTACK_TEST_PG_URL: "postgresql+psycopg://sqlastack:sqlastack@localhost:5432/sqlastack_test"

    steps:
      - uses: actions/checkout@v6
        with:
          path: sqlastack-formstore
          fetch-depth: 0

      - uses: actions/checkout@v6
        with:
          repository: bluedynamics/sqlastack-core
          path: sqlastack-core
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "sqlastack-formstore/pyproject.toml"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies (Plone stack)
        run: uv sync --extra test --extra test-plone

      - name: Run Plone integration tests with coverage
        run: uv run pytest tests_plone/ --cov --cov-report=

      - name: Rename coverage data
        run: mv .coverage .coverage.plone

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-plone
          path: sqlastack-formstore/.coverage.plone
          include-hidden-files: true
          if-no-files-found: ignore

  coverage:
    name: Combine & check coverage
    if: always()
    needs: [test, test-plone]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sqlastack-formstore

    steps:
      - uses: actions/checkout@v6
        with:
          path: sqlastack-formstore
          fetch-depth: 0

      - uses: actions/checkout@v6
        with:
          repository: bluedynamics/sqlastack-core
          path: sqlastack-core
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "sqlastack-formstore/pyproject.toml"

      - name: Install dependencies
        run: uv sync --extra test

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true
          path: sqlastack-formstore

      - name: Combine coverage & report
        run: |
          uv run coverage combine
          uv run coverage html --skip-covered --skip-empty
          uv run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY
          uv run coverage report

      - name: Upload HTML report if check failed
        uses: actions/upload-artifact@v7
        with:
          name: html-report
          path: sqlastack-formstore/htmlcov
        if: ${{ failure() }}
